[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jasna"
version = "0.8.0"
description = "Jasna"
readme = "README.md"
requires-python = ">=3.13"
# Hardware-neutral dependencies only; pick exactly one GPU stack via the
# "nvidia" or "intel" extra (see README / docs/intel_arc_server.md).
dependencies = [
  # current_ctx support is merged upstream for PyAV 18.1.0 but is not published yet.
  # Linux releases override this with the pinned upstream-main wheel in build_linux.sh;
  # remove that override and require av>=18.1 once the release reaches PyPI.
  "av>=18,<19",
  "numpy",
  "psutil",
  "diffusers",
  "accelerate",
  "huggingface-hub",
  "mmengine==0.10.7",
  "opencv-python",
  "Pillow",
  "tqdm",
  "customtkinter",
  "tkinterdnd2",
  "ultralytics",
  "onnx",
  "cryptography>=42",
]

[project.scripts]
jasna = "jasna.main:main"

[project.optional-dependencies]
nvidia = [
  "torch==2.12.0+cu130",
  "torchvision==0.27.0+cu130",
  "tensorrt==10.16.1.11",
  "torch-tensorrt==2.12.0",
  "nvidia-vfx",
]
intel = [
  "torch==2.12.0+xpu",
  "torchvision==0.27.0+xpu",
  "pytorch-triton-xpu",
  "openvino>=2026.2",
]
dev = [
  "nuitka>=2.4",
  "pytest",
  "pytest-cov",
  "scikit-build",
  "cmake",
  "ninja",
]

[tool.uv]
conflicts = [[{ extra = "nvidia" }, { extra = "intel" }]]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu130", extra = "nvidia" },
  { index = "pytorch-xpu", extra = "intel" },
]
torchvision = [
  { index = "pytorch-cu130", extra = "nvidia" },
  { index = "pytorch-xpu", extra = "intel" },
]
torch-tensorrt = [{ index = "pytorch-cu130", extra = "nvidia" }]
pytorch-triton-xpu = [{ index = "pytorch-xpu", extra = "intel" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-xpu"
url = "https://download.pytorch.org/whl/xpu"
explicit = true

[tool.setuptools]
packages = ["jasna", "jasna.gui", "jasna.mosaic", "jasna.ov", "jasna.restorer", "jasna.trt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
  "ignore:'maxsplit' is passed as positional argument:DeprecationWarning:mmengine\\.utils\\.misc",
  "ignore:`torch\\.jit\\.script` is deprecated:DeprecationWarning",
]
